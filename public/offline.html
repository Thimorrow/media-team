<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8f2ed">
  <meta name="color-scheme" content="light">
  <title>Offline | Media Team</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: oklch(0.965 0.009 65); color: oklch(0.265 0.018 325); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 28rem; padding: calc(2rem + env(safe-area-inset-top, 0px)) max(2rem, env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) max(2rem, env(safe-area-inset-left, 0px)); }
    h1 { font-size: 2rem; line-height: 1.15; }
    button { border: 0; border-radius: .6rem; padding: .8rem 1.2rem; background: oklch(0.425 0.09 325); color: oklch(1 0 0); min-height: 44px; touch-action: manipulation; font: inherit; cursor: pointer; }
    body { -webkit-font-smoothing: antialiased; }
    h1 { text-wrap: balance; }
    button:focus-visible { outline: 2px solid oklch(0.4 0 0); outline-offset: 4px; }
    button:active { background: oklch(0.34 0.065 325); }
  </style>
</head>
<body>
  <main>
    <h1>Du bist offline</h1>
    <p>Verbinde dich mit dem Internet und lade die Seite erneut. Ohne Verbindung kannst du deine Aufgaben nicht öffnen.</p>
    <button type="button" onclick="location.reload()">Neu laden</button>
  </main>
</body>
</html>
