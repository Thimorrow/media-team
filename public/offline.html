<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Offline | Media Team</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f0; color: #225541; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; }
    h1 { font-size: 2rem; line-height: 1.15; }
    button { border: 0; border-radius: .6rem; padding: .8rem 1.2rem; background: #225541; color: white; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Du bist offline</h1>
    <p>Prüfe deine Internetverbindung und lade die Seite erneut. Deine Aufgaben sind nur mit Internetverbindung verfügbar.</p>
    <button type="button" onclick="location.reload()">Neu laden</button>
  </main>
</body>
</html>
